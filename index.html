<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GPA Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 30px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select,
    button {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      background: #007bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 25px;
    }

    table, th, td {
      border: 1px solid #ccc;
    }

    th, td {
      padding: 10px;
      text-align: center;
    }

    .preview {
      margin-top: 20px;
      padding: 15px;
      background: #e9f5ff;
      border-radius: 5px;
    }

    .gpa {
      font-size: 24px;
      font-weight: bold;
      color: #007bff;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>GPA Calculator</h1>

    <div class="form-group">
      <label>Course Name</label>
      <input type="text" id="courseName" placeholder="Enter course name">
    </div>

    <div class="form-group">
      <label>Credit Hours</label>
      <input type="number" id="creditHours" placeholder="Enter credit hours">
    </div>

    <div class="form-group">
      <label>Grade Target</label>
      <select id="grade">
        <option value="4.0">A</option>
        <option value="3.5">B+</option>
        <option value="3.0">B</option>
        <option value="2.5">C+</option>
        <option value="2.0">C</option>
        <option value="1.0">D</option>
        <option value="0.0">F</option>
      </select>
    </div>

    <button onclick="addCourse()">Add Course</button>

    <table>
      <thead>
        <tr>
          <th>Course</th>
          <th>Credits</th>
          <th>Grade</th>
          <th>Points</th>
        </tr>
      </thead>
      <tbody id="courseList"></tbody>
    </table>

    <div class="preview">
      <h2>Live GPA Preview</h2>
      <p>Total Credits: <span id="totalCredits">0</span></p>
      <p>Total Points: <span id="totalPoints">0</span></p>
      <p class="gpa">Estimated GPA: <span id="gpa">0.00</span></p>
    </div>
  </div>

  <script>
    let totalCredits = 0;
    let totalPoints = 0;

    function addCourse() {
      const courseName = document.getElementById("courseName").value;
      const creditHours = parseFloat(document.getElementById("creditHours").value);
      const grade = parseFloat(document.getElementById("grade").value);

      if (!courseName || isNaN(creditHours)) {
        alert("Please fill all fields.");
        return;
      }

      const points = creditHours * grade;

      totalCredits += creditHours;
      totalPoints += points;

      const gpa = totalPoints / totalCredits;

      // Add row to table
      const table = document.getElementById("courseList");

      const row = `
        <tr>
          <td>${courseName}</td>
          <td>${creditHours}</td>
          <td>${grade}</td>
          <td>${points.toFixed(2)}</td>
        </tr>
      `;

      table.innerHTML += row;

      // Update GPA preview
      document.getElementById("totalCredits").innerText = totalCredits;
      document.getElementById("totalPoints").innerText = totalPoints.toFixed(2);
      document.getElementById("gpa").innerText = gpa.toFixed(2);

      // Clear inputs
      document.getElementById("courseName").value = "";
      document.getElementById("creditHours").value = "";
    }
  </script>

</body>
</html>
